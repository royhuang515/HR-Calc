<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>到職員工計算工具 - 像素風</title>
    <!-- 引入復古像素字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Noto Sans TC', monospace, sans-serif; image-rendering: pixelated; }
        
        body { 
            background-color: #FFFFFF; /* 背景改為白色 */
            margin: 0; 
            padding: 24px; 
            color: #111111; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 像素化大樹裝飾 (3-4顆，散落於背景四周，不滿版) */
        .pixel-tree {
            position: absolute;
            width: 48px;
            height: 64px;
            z-index: 0;
            pointer-events: none;
        }
        /* 樹冠 (像素綠) */
        .pixel-tree::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 48px;
            height: 44px;
            background: #70AD47;
            border: 3px solid #111111;
            box-shadow: 3px 3px 0px #111111;
        }
        /* 樹幹 (咖啡色) */
        .pixel-tree::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 18px;
            width: 12px;
            height: 20px;
            background: #8B5A2B;
            border: 3px solid #111111;
        }

        /* 散落位置設定 */
        .tree-1 { top: 10%; left: 8%; transform: scale(1.2); }
        .tree-2 { top: 15%; right: 10%; transform: scale(0.9); }
        .tree-3 { bottom: 12%; left: 12%; transform: scale(1); }
        .tree-4 { bottom: 15%; right: 8%; transform: scale(1.3); }

        .pixel-container { 
            width: 100%;
            max-width: 680px; 
            background: #70AD47; /* 主要區塊維持色號 #70AD47 */
            border: 4px solid #111111;
            box-shadow: 8px 8px 0px #111111;
            padding: 24px;
            position: relative;
            z-index: 1; /* 確保內容在樹的上方 */
        }

        /* 像素風大標題 (第一層) */
        .pixel-header { 
            text-align: center;
            margin-bottom: 30px;
            padding: 15px;
            border: 4px solid #111111;
            background: #FFD966; /* 按鈕色 */
            box-shadow: 4px 4px 0px #111111;
        }
        .pixel-header h1 { 
            margin: 0; 
            font-size: 22px; 
            font-weight: 900; 
            color: #111111;
            letter-spacing: 2px;
        }

        /* 第二層透明標題區塊 */
        .pixel-transparent-header {
            text-align: center;
            margin-bottom: 25px;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
        }
        .pixel-transparent-header h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 2px 2px 0px #111111;
        }
        .pixel-transparent-header p {
            margin: 6px 0 0 0;
            font-size: 13px;
            color: #ffffcc;
            text-shadow: 1px 1px 0px #111111;
        }

        /* 畫面管理 */
        .screen-pane { display: none; }
        .screen-pane.active { display: block; }

        /* 第一層主選單按鈕 (左右並排) */
        .main-menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .pixel-big-btn {
            background: #FFD966; /* 按鈕色 */
            border: 4px solid #111111;
            box-shadow: 4px 4px 0px #111111;
            padding: 30px 15px;
            text-align: center;
            cursor: pointer;
            font-size: 16px;
            font-weight: 900;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .pixel-big-btn:hover {
            background: #ffc733;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #111111;
        }
        .pixel-big-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #111111;
        }
        .pixel-icon {
            font-size: 28px;
        }

        /* 通用像素按鈕與欄位 */
        .pixel-btn {
            background: #FFD966; /* 按鈕色 */
            border: 3px solid #111111;
            box-shadow: 3px 3px 0px #111111;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 900;
            color: #111111;
            cursor: pointer;
            width: 100%;
            text-align: center;
            margin-top: 10px;
            transition: transform 0.1s;
        }
        .pixel-btn:hover { background: #ffc733; transform: translate(-1px, -1px); box-shadow: 4px 4px 0px #111111; }
        .pixel-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px #111111; }

        .pixel-btn-secondary {
            background: #ffffff;
            border: 3px solid #111111;
            box-shadow: 3px 3px 0px #111111;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 900;
            color: #111111;
            cursor: pointer;
            margin-top: 15px;
        }
        .pixel-btn-secondary:hover { background: #f0f0f0; }

        .pixel-input-group {
            margin-bottom: 16px;
        }
        .pixel-input-group label {
            display: block;
            font-size: 13px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 1px 1px 0px #111111;
            margin-bottom: 6px;
        }
        .pixel-input-group input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border: 3px solid #111111;
            background: #FFD966; /* 輸入欄位處依色號 */
            font-weight: 700;
            color: #111111;
            box-shadow: 2px 2px 0px #111111;
            outline: none;
        }

        /* 選項清單 (問答) */
        .pixel-options-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .pixel-opt-btn {
            background: #FFD966; /* 按鈕色 */
            border: 3px solid #111111;
            box-shadow: 3px 3px 0px #111111;
            padding: 14px 18px;
            text-align: left;
            font-size: 14px;
            font-weight: 900;
            color: #111111;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pixel-opt-btn:hover {
            background: #ffc733;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px #111111;
        }

        /* 結果顯示卡片 */
        .pixel-result-box {
            background: #ffffff;
            border: 3px solid #111111;
            box-shadow: 4px 4px 0px #111111;
            padding: 16px;
            margin-bottom: 14px;
        }
        .pixel-result-title {
            font-size: 12px;
            font-weight: 900;
            color: #666666;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .pixel-result-content {
            font-size: 14px;
            font-weight: 900;
            color: #111111;
            line-height: 1.5;
        }
        .pixel-badge {
            display: inline-block;
            padding: 4px 10px;
            border: 2px solid #111111;
            font-size: 13px;
            font-weight: 900;
            box-shadow: 2px 2px 0px #111111;
        }
        .badge-blue { background: #99ccff; }
        .badge-purple { background: #cc99ff; }
        .badge-green { background: #99ff99; }

        .hidden { display: none !important; }
    </style>
</head>
